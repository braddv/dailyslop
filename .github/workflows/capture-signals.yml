name: Capture daily market signals

# Requires the GitHub Actions repository secret CRON_SECRET to match the
# production CRON_SECRET used by the protected capture endpoints.

on:
  schedule:
    # Run both UTC candidates; the local-time gate handles daylight saving.
    - cron: "0 18,19 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-market-signal-capture
  cancel-in-progress: false

jobs:
  capture:
    name: Capture ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: S&P 500
            endpoint: signal-history
          - name: QQQ
            endpoint: qqq-signal-history
          - name: SmallCap
            endpoint: smallcap-signal-history

    steps:
      - name: Check Eastern snapshot window
        id: window
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$(TZ=America/New_York date +%H)" == "14" ]]; then
            echo "capture=true" >> "$GITHUB_OUTPUT"
          else
            echo "capture=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate capture secret
        if: steps.window.outputs.capture == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [[ -z "${CRON_SECRET}" ]]; then
            echo "Missing required GitHub Actions secret: CRON_SECRET" >&2
            exit 1
          fi

      - name: Capture ${{ matrix.name }} signals
        if: steps.window.outputs.capture == 'true'
        env:
          CAPTURE_ENDPOINT: ${{ matrix.endpoint }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          status_code="$(curl \
            --silent \
            --show-error \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 180 \
            --output "${response_file}" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Accept: application/json" \
            "https://dailyslop.ai/api/${CAPTURE_ENDPOINT}?mode=capture")"

          jq . "${response_file}"

          if [[ ! "${status_code}" =~ ^2 ]]; then
            echo "Capture failed with HTTP ${status_code}" >&2
            exit 1
          fi

          jq --exit-status '.success == true or .skipped == true' "${response_file}" >/dev/null
